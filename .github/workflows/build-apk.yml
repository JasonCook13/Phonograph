name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Phonograph.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Phonograph-apk
          path: Phonograph.apk

      # A single always-updated release, so the phone can download a plain .apk link:
      # https://github.com/<you>/Phonograph/releases/download/latest-build/Phonograph.apk
      - name: Point latest-build tag at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true

      - name: Publish to "latest-build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          make_latest: false
          body: "Built from ${{ github.sha }}. Download Phonograph.apk on your phone and tap it to install."
          files: Phonograph.apk
