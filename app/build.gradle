apply plugin: 'com.android.application'

static def gitBranch() {
    def branch = 'GitHub'
    try {
        def gitcheck = 'command -v git >/dev/null 2>&1'.execute()
        gitcheck.waitFor()
        if (gitcheck.exitValue() == 0) {
            def proc = 'git rev-parse --abbrev-ref HEAD'.execute()
            proc.in.eachLine { line -> branch = line }
            proc.err.eachLine { line -> println line }
            proc.waitFor()
        }
    } catch (Exception e) {
        // Do nothing
        println e
    }
    branch
}

android {
    namespace 'com.kabouzeid.gramophone'
    compileSdk 34

    defaultConfig {
        minSdkVersion 21
        // Kept at 29 for now: the next step (Media3 + new permission model) raises this.
        targetSdkVersion 29

        vectorDrawables.useSupportLibrary = true

        // Own app id so it installs next to (not over) the Play Store / F-Droid Phonograph.
        applicationId 'com.jasoncook13.phonograph'
        versionCode 180
        versionName '1.4.0-jc'
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        // A fixed key committed to the repo so every CI build can update the
        // previous install. Fine for a personal sideloaded app; don't reuse it elsewhere.
        personal {
            storeFile rootProject.file('keystore/personal.keystore')
            storePassword 'phonograph'
            keyAlias 'phonograph'
            keyPassword 'phonograph'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.personal
        }
        debug {
            signingConfig signingConfigs.personal
            versionNameSuffix ' (' + defaultConfig.versionCode + ') DEBUG (' + gitBranch() + ')'
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/DEPENDENCIES']
        }
    }
    lint {
        disable 'MissingTranslation', 'InvalidPackage'
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

